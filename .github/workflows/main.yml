name: Backend CI/CD

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  test:
    name: Test
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode verify

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dimkolya-backend:pr-${{ github.event.pull_request.number }}

  deploy:
    name: Deploy merged PR
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dimkolya-backend:${{ github.event.pull_request.merge_commit_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dimkolya-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd /root/dimkolya
            IMAGE_TAG="$IMAGE_TAG" docker compose pull backend
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --wait backend
            docker image prune -f
