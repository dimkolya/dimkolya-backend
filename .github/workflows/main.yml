name: Backend CI/CD

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  test:
    name: Test
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode verify

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dimkolya-backend:pr-${{ github.event.pull_request.number }}

  deploy:
    name: Deploy merged PR
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dimkolya-backend:${{ github.event.pull_request.merge_commit_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dimkolya-backend:latest

      - name: Copy deployment configuration to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/nginx.conf,deploy/nginx-backend-proxy.conf"
          target: /root/dimkolya
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd /root/dimkolya
            install -m 0644 deploy/nginx.conf /etc/nginx/sites-available/dimkolya-backend
            install -m 0644 deploy/nginx-backend-proxy.conf /etc/nginx/snippets/dimkolya-backend-proxy.conf
            ln -sfn /etc/nginx/sites-available/dimkolya-backend /etc/nginx/sites-enabled/dimkolya-backend
            unlink /etc/nginx/sites-enabled/default 2>/dev/null || true
            nginx -t
            IMAGE_TAG="$IMAGE_TAG" docker compose pull backend
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --wait backend
            systemctl reload nginx
            curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
            docker image prune -f
