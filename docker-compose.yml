services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dimkolya}
      POSTGRES_USER: ${POSTGRES_USER:-dimkolya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dimkolya} -d ${POSTGRES_DB:-dimkolya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME:-dimkolya}/dimkolya-backend:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dimkolya}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-dimkolya}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY: file:/app/keys/private.pem
      JWT_PUBLIC_KEY: file:/app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
